name: Repository Maintenance & Automation

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect retention candidates without deleting workflow history'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prune stale branches and inspect repository health
        run: |
          git fetch --prune
          echo "Repository branches and references pruned."
      - name: Delete older workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 5
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

