name: Automated Dependency Updates

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-updates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check outdated frontend dependencies
        run: npm --prefix frontend outdated || true
      - name: Check outdated backend dependencies
        run: npm --prefix backend outdated || true
      - name: Check outdated discovery dependencies
        run: npm --prefix discovery outdated || true
