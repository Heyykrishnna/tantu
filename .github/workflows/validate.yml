name: Validate application and L0 evidence

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            discovery/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.3
          cache-dependency-path: archive/qualification/go.sum
      - name: Resolve installed PostgreSQL binaries
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          candidates = sorted(Path('/usr/lib/postgresql').glob('*/bin'), key=lambda path: int(path.parent.name))
          if not candidates:
              raise SystemExit('PostgreSQL command-line tools are required.')
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('PG_BIN=' + str(candidates[-1]) + '\n')
          PY
      - run: npm run setup
      - name: Install isolated browser dependencies
        working-directory: discovery
        run: npx playwright install --with-deps chromium
      - run: npm run check:l0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: l0-synthetic-qualification
          path: discovery/.artifacts/
          if-no-files-found: warn
