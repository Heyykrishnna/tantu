name: End-to-End Testing

on:
  push:
    paths:
      - "discovery/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "discovery/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            discovery/package-lock.json
      - name: Resolve installed PostgreSQL binaries
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          candidates = sorted(Path('/usr/lib/postgresql').glob('*/bin'), key=lambda path: int(path.parent.name))
          if not candidates:
              raise SystemExit('PostgreSQL command-line tools are required.')
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('PG_BIN=' + str(candidates[-1]) + '\n')
          PY
      - name: Install dependencies
        run: npm run setup
      - name: Build frontend production bundle
        run: npm --prefix frontend run build
      - name: Install Playwright browser dependencies
        working-directory: discovery
        run: npx playwright install --with-deps chromium
      - name: Run discovery unit test suite
        run: npm --prefix discovery test
      - name: Execute Playwright browser journeys
        working-directory: discovery
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: discovery/.artifacts/
          if-no-files-found: ignore
