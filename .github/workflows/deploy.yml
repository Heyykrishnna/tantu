name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      confirm_production:
        description: 'Type "DEPLOY" to confirm production release'
        required: false
        default: ''
        type: string
      validation_only:
        description: 'Validate build readiness without deploying to an environment'
        required: true
        default: true
        type: boolean
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: deployment-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: npm run setup
      - name: Verify production builds
        run: npm run build
      - name: Validate safety gate for production
        if: github.event.inputs.environment == 'production' && github.event.inputs.confirm_production != 'DEPLOY'
        run: |
          echo "Production deployment aborted: confirmation string must be 'DEPLOY'."
          exit 1
      - name: Summarize deployment validation
        if: github.event_name == 'workflow_dispatch' && inputs.validation_only
        run: echo 'Production builds verified. Validation-only mode does not deploy an application or perform a remote health check.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'release' || !inputs.validation_only
    needs: pre-deploy-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a configured deployment adapter
        run: |
          echo '::error::No hosting deployment adapter is configured. Configure artifact transfer, service activation, and an actual /health/ready request before enabling deployment.'
          exit 1

