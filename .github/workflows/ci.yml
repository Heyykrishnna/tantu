name: CI Pipeline (Frontend + Backend)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            discovery/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
          cache-dependency-path: archive/qualification/go.sum
      - name: Resolve installed PostgreSQL binaries
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          candidates = sorted(Path('/usr/lib/postgresql').glob('*/bin'), key=lambda path: int(path.parent.name))
          if not candidates:
              raise SystemExit('PostgreSQL command-line tools are required.')
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('PG_BIN=' + str(candidates[-1]) + '\n')
          PY
      - name: Install dependencies
        run: npm run setup
      - name: Install isolated browser dependencies
        working-directory: discovery
        run: npx playwright install --with-deps chromium
      - name: Run code formatting, typecheck, unit tests, and production build
        run: npm run check
      - name: Run foundation synthetic qualification
        run: npm run check:l0
      - name: Run connected-work synthetic qualification
        run: npm run check:l1b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-pipeline-artifacts
          path: discovery/.artifacts/
          if-no-files-found: warn
